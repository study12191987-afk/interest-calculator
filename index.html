<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#1976d2">

    <title>利息计算器</title>

    <link rel="manifest" href="manifest.json">


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    180deg,
                    #eaf3ff 0%,
                    #f7f9fc 45%,
                    #f7f9fc 100%
                );

            color: #1f2937;

            min-height: 100vh;

        }


        .calculator {

            width: 100%;

            max-width: 460px;

            margin: 0 auto;

            padding: 20px 18px 40px;

        }


        /* 顶部区域 */

        .header {

            background:
                linear-gradient(
                    135deg,
                    #1976d2,
                    #42a5f5
                );

            color: white;

            padding: 28px 22px 30px;

            border-radius: 24px;

            text-align: center;

            box-shadow:
                0 10px 30px rgba(25, 118, 210, 0.25);

            margin-bottom: 20px;

        }


        .header-icon {

            width: 58px;

            height: 58px;

            margin: 0 auto 12px;

            background: rgba(255, 255, 255, 0.18);

            border-radius: 18px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 30px;

        }


        .header h1 {

            margin: 0;

            font-size: 29px;

            font-weight: 700;

            letter-spacing: 1px;

        }


        .header p {

            margin: 8px 0 0;

            font-size: 14px;

            opacity: 0.9;

        }


        /* 输入区域 */

        .input-card {

            background: white;

            padding: 22px;

            border-radius: 22px;

            box-shadow:
                0 6px 24px rgba(0, 0, 0, 0.07);

            margin-bottom: 20px;

        }


        .section-title {

            font-size: 17px;

            font-weight: 700;

            margin-bottom: 20px;

            color: #222;

        }


        .input-group {

            margin-bottom: 18px;

        }


        .input-group label {

            display: block;

            font-weight: 600;

            font-size: 14px;

            margin-bottom: 8px;

            color: #374151;

        }


        .input-wrapper {

            position: relative;

        }


        .input-prefix {

            position: absolute;

            left: 15px;

            top: 50%;

            transform: translateY(-50%);

            font-size: 18px;

            color: #6b7280;

            font-weight: 600;

        }


        .input-suffix {

            position: absolute;

            right: 15px;

            top: 50%;

            transform: translateY(-50%);

            font-size: 17px;

            color: #6b7280;

            font-weight: 600;

        }


        .input-group input {

            width: 100%;

            padding: 15px 42px;

            border: 2px solid #e5e7eb;

            border-radius: 13px;

            font-size: 18px;

            color: #111827;

            background: #fafafa;

            outline: none;

            transition: 0.2s;

        }


        .input-group input.rate-input {

            padding-left: 15px;

            padding-right: 42px;

        }


        .input-group input:focus {

            border-color: #1976d2;

            background: white;

            box-shadow:
                0 0 0 4px rgba(25, 118, 210, 0.10);

        }


        .input-group input::placeholder {

            color: #b0b7c3;

        }


        /* 按钮 */

        .button-group {

            display: flex;

            gap: 10px;

            margin-top: 22px;

        }


        button {

            flex: 1;

            padding: 15px;

            border: none;

            border-radius: 13px;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;

        }


        .calculate-button {

            background:
                linear-gradient(
                    135deg,
                    #1976d2,
                    #2196f3
                );

            color: white;

            box-shadow:
                0 5px 15px rgba(25, 118, 210, 0.25);

        }


        .calculate-button:hover {

            transform: translateY(-1px);

        }


        .calculate-button:active {

            transform: scale(0.98);

        }


        .clear-button {

            background: #f1f3f5;

            color: #555;

        }


        .clear-button:hover {

            background: #e5e7eb;

        }


        .clear-button:active {

            transform: scale(0.98);

        }


        /* 错误提示 */

        .error {

            color: #d32f2f;

            background: #fff1f2;

            border-radius: 10px;

            padding: 10px;

            text-align: center;

            margin-top: 15px;

            font-size: 14px;

            display: none;

        }


        /* 结果区域 */

        .results {

            margin-top: 5px;

        }


        .results-title {

            font-size: 17px;

            font-weight: 700;

            margin: 0 0 12px 3px;

        }


        .result-card {

            background: white;

            margin-bottom: 12px;

            padding: 18px 20px;

            border-radius: 17px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            box-shadow:
                0 5px 18px rgba(0, 0, 0, 0.06);

            border: 1px solid rgba(0, 0, 0, 0.03);

        }


        .result-left {

            display: flex;

            align-items: center;

            gap: 12px;

        }


        .result-icon {

            width: 42px;

            height: 42px;

            border-radius: 12px;

            background: #eaf3ff;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 21px;

        }


        .result-title {

            color: #6b7280;

            font-size: 14px;

        }


        .result-subtitle {

            color: #a0a7b2;

            font-size: 11px;

            margin-top: 3px;

        }


        .result-value {

            font-size: 20px;

            font-weight: 700;

            color: #1976d2;

        }


        /* 提示 */

        .note {

            background: rgba(255, 255, 255, 0.75);

            border-radius: 14px;

            padding: 13px 15px;

            text-align: center;

            color: #7b8491;

            font-size: 11px;

            margin-top: 20px;

            line-height: 1.6;

        }


        /* 底部 */

        .footer {

            text-align: center;

            color: #a0a7b2;

            font-size: 11px;

            margin-top: 18px;

        }


        /* 手机小屏幕 */

        @media (max-width: 360px) {

            .calculator {

                padding-left: 12px;

                padding-right: 12px;

            }

            .header {

                padding: 24px 18px 26px;

            }

            .header h1 {

                font-size: 26px;

            }

            .input-card {

                padding: 18px;

            }

            .result-value {

                font-size: 18px;

            }

        }

    </style>

</head>


<body>


<div class="calculator">


    <!-- 顶部 -->

    <div class="header">

        <div class="header-icon">
            💰
        </div>

        <h1>
            利息计算器
        </h1>

        <p>
            银行存款 / 投资利息估算
        </p>

    </div>


    <!-- 输入 -->

    <div class="input-card">

        <div class="section-title">
            输入计算信息
        </div>


        <div class="input-group">

            <label for="principal">
                本金 Principal
            </label>

            <div class="input-wrapper">

                <span class="input-prefix">
                    $
                </span>

                <input
                    type="number"
                    id="principal"
                    placeholder="例如：10000"
                    inputmode="decimal"
                >

            </div>

        </div>


        <div class="input-group">

            <label for="rate">
                年利率 Annual Rate
            </label>

            <div class="input-wrapper">

                <input
                    type="number"
                    id="rate"
                    class="rate-input"
                    placeholder="例如：5"
                    step="0.01"
                    inputmode="decimal"
                >

                <span class="input-suffix">
                    %
                </span>

            </div>

        </div>


        <div class="button-group">

            <button
                class="calculate-button"
                onclick="calculateInterest()">

                计算利息

            </button>


            <button
                class="clear-button"
                onclick="clearCalculator()">

                清除

            </button>

        </div>


        <div id="error" class="error"></div>

    </div>


    <!-- 结果 -->

    <div class="results">

        <div class="results-title">
            计算结果
        </div>


        <div class="result-card">

            <div class="result-left">

                <div class="result-icon">
                    ☀️
                </div>

                <div>

                    <div class="result-title">
                        每日利息
                    </div>

                    <div class="result-subtitle">
                        Daily Interest
                    </div>

                </div>

            </div>


            <div class="result-value">
                $<span id="dailyResult">0.00</span>
            </div>

        </div>


        <div class="result-card">

            <div class="result-left">

                <div class="result-icon">
                    📅
                </div>

                <div>

                    <div class="result-title">
                        每月利息
                    </div>

                    <div class="result-subtitle">
                        Monthly Interest
                    </div>

                </div>

            </div>


            <div class="result-value">
                $<span id="monthlyResult">0.00</span>
            </div>

        </div>


        <div class="result-card">

            <div class="result-left">

                <div class="result-icon">
                    💵
                </div>

                <div>

                    <div class="result-title">
                        每年利息
                    </div>

                    <div class="result-subtitle">
                        Annual Interest
                    </div>

                </div>

            </div>


            <div class="result-value">
                $<span id="yearlyResult">0.00</span>
            </div>

        </div>

    </div>


    <!-- 说明 -->

    <div class="note">

        💡 以上结果为简单利息估算。<br>

        实际银行利息可能因计算方式不同而有所差异。

    </div>


    <div class="footer">

        利息计算器 · Interest Calculator

    </div>


</div>


<script>


    function formatMoney(number) {

        return number.toLocaleString("en-US", {

            minimumFractionDigits: 2,

            maximumFractionDigits: 2

        });

    }


    function calculateInterest() {

        let principal =
            Number(
                document.getElementById("principal").value
            );


        let rate =
            Number(
                document.getElementById("rate").value
            );


        let error =
            document.getElementById("error");


        error.style.display = "none";


        /* 检查本金 */

        if (principal <= 0) {

            error.textContent =
                "请输入大于 0 的本金。";

            error.style.display =
                "block";

            return;

        }


        /* 检查利率 */

        if (rate < 0) {

            error.textContent =
                "年利率不能小于 0。";

            error.style.display =
                "block";

            return;

        }


        /* 计算每年利息 */

        let yearlyInterest =
            principal * (rate / 100);


        /* 计算每月利息 */

        let monthlyInterest =
            yearlyInterest / 12;


        /* 计算每日利息 */

        let dailyInterest =
            yearlyInterest / 365;


        /* 显示结果 */

        document.getElementById("dailyResult").textContent =
            formatMoney(dailyInterest);


        document.getElementById("monthlyResult").textContent =
            formatMoney(monthlyInterest);


        document.getElementById("yearlyResult").textContent =
            formatMoney(yearlyInterest);

    }


    function clearCalculator() {

        document.getElementById("principal").value = "";


        document.getElementById("rate").value = "";


        document.getElementById("dailyResult").textContent =
            "0.00";


        document.getElementById("monthlyResult").textContent =
            "0.00";


        document.getElementById("yearlyResult").textContent =
            "0.00";


        document.getElementById("error").style.display =
            "none";

    }


    /* 注册 Service Worker */

    if ("serviceWorker" in navigator) {

        navigator.serviceWorker.register(
            "service-worker.js"
        );

    }


</script>


</body>

</html>
