<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#1976d2">

    <title>利息计算器</title>

    <link rel="manifest" href="manifest.json">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        .calculator {
            width: 100%;
            max-width: 430px;
            margin: 0 auto;
            padding: 25px 20px 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            margin: 0;
            font-size: 30px;
        }

        .header p {
            margin-top: 8px;
            color: #666;
            font-size: 14px;
        }

        .input-card {
            background: white;
            padding: 20px;
            border-radius: 18px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 18px;
            outline: none;
        }

        .input-group input:focus {
            border-color: #1976d2;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            cursor: pointer;
        }

        .calculate-button {
            background: #1976d2;
            color: white;
        }

        .clear-button {
            background: #e0e0e0;
            color: #333;
        }

        .error {
            color: #d32f2f;
            text-align: center;
            margin-top: 15px;
            display: none;
        }

        .results {
            margin-top: 20px;
        }

        .result-card {
            background: white;
            margin-bottom: 12px;
            padding: 18px 20px;
            border-radius: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
        }

        .result-title {
            color: #666;
            font-size: 15px;
        }

        .result-value {
            font-size: 21px;
            font-weight: bold;
        }

        .note {
            text-align: center;
            color: #888;
            font-size: 12px;
            margin-top: 20px;
            line-height: 1.5;
        }

    </style>
</head>


<body>

    <div class="calculator">

        <div class="header">

            <h1>利息计算器</h1>

            <p>银行存款 / 投资利息估算</p>

        </div>


        <div class="input-card">

            <div class="input-group">

                <label for="principal">
                    本金 Principal
                </label>

                <input
                    type="number"
                    id="principal"
                    placeholder="例如：10000"
                    inputmode="decimal"
                >

            </div>


            <div class="input-group">

                <label for="rate">
                    年利率 Annual Rate (%)
                </label>

                <input
                    type="number"
                    id="rate"
                    placeholder="例如：5"
                    step="0.01"
                    inputmode="decimal"
                >

            </div>


            <div class="button-group">

                <button
                    class="calculate-button"
                    onclick="calculateInterest()">
                    计算利息
                </button>

                <button
                    class="clear-button"
                    onclick="clearCalculator()">
                    清除
                </button>

            </div>


            <div id="error" class="error"></div>

        </div>


        <div class="results">

            <div class="result-card">

                <div class="result-title">
                    每日利息
                </div>

                <div class="result-value">
                    $<span id="dailyResult">0.00</span>
                </div>

            </div>


            <div class="result-card">

                <div class="result-title">
                    每月利息
                </div>

                <div class="result-value">
                    $<span id="monthlyResult">0.00</span>
                </div>

            </div>


            <div class="result-card">

                <div class="result-title">
                    每年利息
                </div>

                <div class="result-value">
                    $<span id="yearlyResult">0.00</span>
                </div>

            </div>

        </div>


        <div class="note">

            以上结果为简单利息估算。
            实际银行利息可能因计算方式不同而有所差异。

        </div>

    </div>


    <script>

        function formatMoney(number) {

            return number.toLocaleString("en-US", {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });

        }


        function calculateInterest() {

            let principal =
                Number(document.getElementById("principal").value);

            let rate =
                Number(document.getElementById("rate").value);

            let error =
                document.getElementById("error");


            // 清除以前的错误
            error.style.display = "none";


            // 检查本金
            if (principal <= 0) {

                error.textContent =
                    "请输入大于 0 的本金。";

                error.style.display = "block";

                return;
            }


            // 检查利率
            if (rate < 0) {

                error.textContent =
                    "年利率不能小于 0。";

                error.style.display = "block";

                return;
            }


            // 每年利息
            let yearlyInterest =
                principal * (rate / 100);


            // 每月利息
            let monthlyInterest =
                yearlyInterest / 12;


            // 每日利息
            let dailyInterest =
                yearlyInterest / 365;


            // 显示结果
            document.getElementById("dailyResult").textContent =
                formatMoney(dailyInterest);

            document.getElementById("monthlyResult").textContent =
                formatMoney(monthlyInterest);

            document.getElementById("yearlyResult").textContent =
                formatMoney(yearlyInterest);

        }


        function clearCalculator() {

            document.getElementById("principal").value = "";

            document.getElementById("rate").value = "";

            document.getElementById("dailyResult").textContent =
                "0.00";

            document.getElementById("monthlyResult").textContent =
                "0.00";

            document.getElementById("yearlyResult").textContent =
                "0.00";

            document.getElementById("error").style.display =
                "none";

        }


        // 注册 Service Worker
        if ("serviceWorker" in navigator) {

            navigator.serviceWorker.register(
                "service-worker.js"
            );

        }

    </script>

</body>

</html>

    

</body>
</html>
